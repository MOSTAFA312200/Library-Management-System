{% extends "base.html" %}

{% block title %}
Login - Library Management System
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        Login
    </h1>

    <p>
        Login to your library account.
    </p>


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p class="form-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Request Membership
        </a>

    </p>

</div>

{% endblock %}
